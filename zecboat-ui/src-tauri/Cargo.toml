[package]
name = "zecboat-ui"
version = "0.7.4"
description = "Shielded Zcash wallet for znft (Zec Non Fungible Thing)"
authors = ["Zecboat <speed@zecboat.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zecboat_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.150"  # exact: the canonical lading is its output (WAKE-v1 §7.3, audit F-10)
zecboat-core = { path = "../../zecboat-core" }
tauri-plugin-deep-link = "2.4.9"

[features]
# Test builds only (testB/testD): see zecboat-core's feature of the same name.
test-overrides = ["zecboat-core/test-overrides"]



[profile.dev.package."*"]
opt-level = 3


# Release hardening, added 2026-09-07.
#
# `strip` removes debug symbols and the symbol table. Beyond size, those symbols are where
# the build machine's absolute paths live: the shipped 0.6.2 binary carried 1,070 copies of
# the builder's home directory, including the source tree's own path. Tauri's IPC is JSON over a custom
# webview scheme and does not resolve Rust symbols dynamically, so stripping is safe.
#
# Paths are also remapped at build time via
#   RUSTFLAGS="--remap-path-prefix=$HOME=/build"
# which is what actually removes registry paths. `strip` alone is not sufficient.
#
# codegen-units = 1 is deliberately NOT set here: it materially lengthens the build for a
# marginal size gain, and it is only worth adding when reproducible builds land in 0.8.0.
[profile.release]
strip = true
