[package]
name = "zecboat-core"
version = "0.7.2"
edition = "2021"

[dependencies]
# gRPC / Protobuf
#
# tonic 0.14 matches zcash_client_backend 0.24's own gRPC client, which lets the
# sync engine use `zcash_client_backend::proto` directly instead of compiling a
# second copy of the protos here. The old setup carried BOTH prost 0.12 (for the
# locally generated client) and prost 0.14 (for the backend's types), and
# re-encoded every compact block to cross between them. Once the sync engine is
# ported (W4), build.rs, proto/ and tonic-build all go away.
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
prost = "0.14"
tokio-stream = "0.1"

# Zcash ecosystem — the Ironwood (NU6.3) stack.
#
# Versions copied verbatim from ~/ironwood_shield/Cargo.toml, which built and
# broadcast the real mined Ironwood transaction. The two release candidates are
# pinned with `=` deliberately: they are consensus-relevant, and a silent patch
# bump could change transaction construction. Do not relax those pins.
#
# zcash_address stays at 0.12 — 0.9 was yanked (core2).
zcash_protocol = "0.11.0"
zcash_client_sqlite = { version = "=0.23.0", features = ["orchard", "transparent-inputs", "serde"] }
zcash_client_backend = { version = "=0.25.0", features = ["orchard", "transparent-inputs", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "pczt"] }
# Wake chapter 2 (2026-09-25): the carrier send builds a PCZT first, so Action pairing can be
# checked and retried BEFORE proving; then proves, signs and extracts it. `serde` on the sqlite
# crate is what lets the backend serialise the account id into the PCZT.
pczt = { version = "0.10.0", features = ["prover", "signer"] }
zcash_primitives = { version = "0.31.0", features = ["transparent-inputs"] }
# 0.13, not 0.12: zip321 0.8 (pulled in by zcash_client_backend 0.24) builds its
# Payment type against 0.13. Pinning 0.12 here put two incompatible ZcashAddress
# types in the tree and `Payment::new` rejected ours.
zcash_address = "0.14.0"
zcash_keys = { version = "0.17.0", features = ["transparent-inputs", "sapling", "orchard", "transparent-key-encoding"] }
zcash_proofs = "0.31.0"

# Database & Concurrency
deadpool-sqlite = "0.12"
# `bundled` compiles SQLite from source rather than linking the build host's libsqlite3.
# Without it the SQLite version is whatever the builder happened to have, which makes the
# binary unreproducible and the behaviour host-dependent — and on Windows and macOS there
# is no system libsqlite3 to link at all.
rusqlite = { version = "0.37", features = ["time", "bundled"] }
tokio = { version = "1", features = ["full"] }

# Serialization and Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.150"  # exact: the canonical lading is its output (WAKE-v1 §7.3, audit F-10)
anyhow = "1.0"
hex = "0.4"
# `rustls-tls` with default-features off, so there is ONE TLS stack in the tree. The
# default feature set pulls `native-tls`, which links the platform's OpenSSL/SChannel/
# Security.framework — a C dependency that differs per platform and per build host. rustls
# is pure Rust and behaves identically everywhere, which is what portability and
# reproducibility both need.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking"] }
bip0039 = "0.12.0"
# BIP-39 requires the phrase be NFKD-normalised BEFORE PBKDF2. bip0039 0.12 normalises for
# the CHECKSUM (mnemonic.rs:365, on a local copy) but stores the phrase as typed, and
# to_seed hashes the stored text under a comment claiming "the phrase has been normalized".
# It has not. We normalise before handing it over. See phrase_to_mnemonic in rpc.rs.
unicode-normalization = "0.1"
# F5: wipes seed bytes and decrypted phrases when they go out of scope.
zeroize = "1"
rand = "0.10"
# `plugin` is not a default feature. It brings in the age plugin protocol, which is how
# age-plugin-yubikey is driven — as a separate executable over stdio, so libpcsclite stays
# out of this binary. See zecboat-core/src/yubi.rs.
age = { version = "0.10.0", features = ["plugin"] }
orchard = "0.16"
shardtree = "0.8"
incrementalmerkletree = "0.9"
nonempty = "0.11.0"
zip32 = "0.3"
once_cell = "1.21.4"
# Wake chapter 8 (2026-09-26): lineage proofs travel with the asset. The in-tree copy of the
# exploratory crate; see ../zmap-wake/WHERE_THIS_CAME_FROM.md. Same pinned crate versions.
zmap-wake = { path = "../zmap-wake", features = ["lightwalletd"] }
zcash_transparent = "0.11.0"
sha2 = "0.10.8"
# The release note's Ed25519 signature (update.rs). Already in the graph through the zcash crates;
# named here so the version is pinned by this crate too.
ed25519-zebra = "4.2"
# A1b: ZMAP identity v1 (BIP-340 ik, BLAKE2b-bound asset ids), verified independently of the mint.
k256 = { version = "0.13", features = ["schnorr"] }
blake2b_simd = "1"
# verify_asset_image returns the hash-checked bytes as a data: URI, so the UI renders the image it
# verified rather than re-fetching unverified bytes.
base64 = "0.22"
# reqwest returns bytes::Bytes; naming the type explicitly keeps the fetch loop readable.
bytes = "1"

# --- issuance verification (the "Design Verified" badge) ---------------------
#
# Issuance (identity v1) signatures are BIP-340 over the manifest's RAW BYTES (issuance_v1.rs);
# ed25519-dalek, which the pre-v1 path used, left with that path (2026-10-09).
#
# zcash_note_encryption is what makes check 5 possible in the wallet: recover an output
# from a published OCK. It was already in the tree transitively; naming it makes the
# dependency deliberate rather than accidental. Version matches ironwood_shield, which is
# where the reference implementation lives.
zcash_note_encryption = "0.5"




# [build-dependencies] removed 2026-08-10.
#
# build.rs and proto/ compiled a second copy of the lightwalletd protos. rpc.rs
# now aliases zcash_client_backend::proto::service instead, so there is nothing
# left to generate. Both were archived to
# a folder outside this repository (removed_proto, 2026-08-10).

[features]
# Reads ZECBOAT_WAKE_MANIFEST and ZECBOAT_PINNED_V1, which let a throwaway collection under test
# name its own genesis outputs and issuer pin. Off by default, so a release build ignores both
# (audit 2026-10-08, Zecboat O): whoever controls a holder's environment must not be able to
# make a wallet trust a manifest it was not built with. Test builds: --features test-overrides.
test-overrides = []

[profile.dev.package."*"]
opt-level = 3
